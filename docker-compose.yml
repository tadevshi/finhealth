# finhealth deployment with PostgreSQL and a cloud LLM provider.
# For Ollama, apply the overlay as well:
# docker compose -f docker-compose.yml -f docker-compose.self-hosted.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finhealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finhealth}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-finhealth}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    build: .
    image: finhealth:local
    command: ["alembic", "upgrade", "head"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finhealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finhealth}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-finhealth}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  finhealth:
    build: .
    image: finhealth:local
    container_name: finhealth
    user: "${HOST_UID:-0}:${HOST_GID:-0}"
    ports:
      - "8000:8000"
    volumes:
      - ./shared:/app/shared
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finhealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finhealth}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-finhealth}
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      LLM_PROVIDER: ${LLM_PROVIDER:-opencode_go}
      LLM_API_ENDPOINT: ${LLM_API_ENDPOINT:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen3.7-max}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      PDF_UPLOAD_DIR: /app/shared
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-10}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
