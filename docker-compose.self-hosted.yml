# Ollama overlay. Always combine this with docker-compose.yml so the base file
# remains the sole PostgreSQL migration owner.

services:
  ollama:
    image: ollama/ollama:latest
    container_name: finhealth-ollama
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  finhealth:
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_API_ENDPOINT: ${LLM_API_ENDPOINT:-http://ollama:11434}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:1.5b}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-300}
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_data:
