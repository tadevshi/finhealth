# openspec/config.yaml — SDD configuration for finhealth (transactions-api)
# Generated by sdd-init on 2026-09-12. Safe to edit; keep the schema keys intact.
schema: spec-driven

strict_tdd: true

context: |
  Project: finhealth (personal financial analyzer and spend control).
  Stack: Python 3.12+ (running 3.13), FastAPI + Uvicorn, SQLAlchemy 2.x async +
  asyncpg, Alembic (one destructive baseline in alembic/versions/), Pydantic v2 +
  pydantic-settings, Jinja2 + HTMX server-rendered web UI.
  Persistence: PostgreSQL 16 is the ONLY supported backend (postgres-only-persistence
  change archived 2026-08-05). DB connection is assembled from discrete POSTGRES_*
  settings; there is no DATABASE_URL.
  PDF ingestion: pikepdf (decryption), markitdown (PDF -> Markdown for LLM),
  pdfplumber (raw character stream for anchored detectors). Services live under
  app/services/pdf/ with a strategy registry (app/services/pdf/strategies/).
  LLM extraction provider: httpx against a local Ollama-compatible endpoint
  (app/services/llm/).
  Architecture: layered FastAPI app.
    app/api/v1/*        — HTTP routers, mounted once in app/api/v1/router.py
    app/schemas/*       — Pydantic request/response models
    app/models/*        — SQLAlchemy ORM models (UUID + timestamp mixins)
    app/services/*      — domain/business logic (ingestion, merchants, dashboard, pdf)
    app/web/*           — Jinja2 templates + HTMX routes
    app/cli/*           — operational CLIs (e.g. seed_demo)
  Testing: pytest + pytest-asyncio (asyncio_mode = "auto"), httpx ASGITransport.
  Integration/DB tests create/drop isolated PostgreSQL databases and SKIP unless
  POSTGRES_TEST_HOST is set. Real-PDF E2E skips unless TEST_RUT is set and sample
  PDFs exist in shared/account-state-examples/ (not committed).
  Quality gates: ruff (lint + format, line-length 100), mypy --strict on app/,
  pre-commit hooks run ruff and mypy.
  Change/artifact conventions: OpenSpec artifacts under openspec/changes/<change>/
  (proposal.md, specs/<capability>/spec.md, design.md, tasks.md, apply-progress.md,
  verify-report.md) with accepted deltas promoted to openspec/specs/<capability>/spec.md.
  Legacy changes under openspec/changes/ and openspec/changes/archive/ are frozen;
  do not modify or rewrite them.

rules:
  proposal:
    require_problem_statement: true
    guidelines:
      - Include explicit In Scope / Out of Scope sections and an Affected Areas table.
      - Include a rollback plan for risky or persistence-touching changes.
      - State assumptions explicitly (e.g. API compatibility, currency conventions).
  spec:
    require_acceptance_criteria: true
    guidelines:
      - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
      - Use Given/When/Then scenarios for every requirement.
      - New capability specs live in openspec/changes/<change>/specs/<capability>/spec.md;
        modified capabilities use a "Delta for <capability>" spec.
      - One requirement per behavior; no implementation detail in specs.
  design:
    require_tradeoffs: true
    guidelines:
      - Document architectural decisions with rationale and rejected alternatives.
      - Preserve the router -> schema -> service -> model layering; mount new routers
        only in app/api/v1/router.py.
      - Money is Numeric(15,2) / Decimal; never float.
  tasks:
    protect_review_workload: true
    guidelines:
      - Group by work unit with hierarchical numbering; each task completable in one session.
      - Keep within the 400-changed-line review budget; if a change exceeds it, surface a
        delivery decision (ask-on-risk) instead of silently growing the diff.
      - Every behavior task starts with a failing test (RED) before implementation.
  apply:
    test_command: "POSTGRES_USER=finhealth POSTGRES_PASSWORD=secret POSTGRES_DB=finhealth pytest"
    guidelines:
      - "Follow strict TDD: RED, GREEN, TRIANGULATE, REFACTOR; record evidence per work unit."
      - Accept async handlers and async test functions (pytest-asyncio auto mode).
      - No new persistence backends; PostgreSQL only.
  verify:
    test_command: "POSTGRES_USER=finhealth POSTGRES_PASSWORD=secret POSTGRES_DB=finhealth pytest"
    guidelines:
      - Run the focused harness ./scripts/verify.sh when touching dashboard/seed/config/docs.
      - Require ruff check and mypy --strict to pass for app/ before archive.
  archive:
    guidelines:
      - Warn before merging destructive deltas; keep historical changes immutable.
      - Promote accepted deltas to openspec/specs/<capability>/spec.md and move the change
        into openspec/changes/archive/YYYY-MM-DD-<change>/.

testing:
  detected: "2026-09-12"
  runner:
    command: "POSTGRES_USER=finhealth POSTGRES_PASSWORD=secret POSTGRES_DB=finhealth pytest"
    framework: "pytest + pytest-asyncio (asyncio_mode=auto) + httpx ASGITransport"
  layers:
    unit: "pytest"
    integration: "pytest (PostgreSQL-backed; skips without POSTGRES_TEST_HOST)"
    e2e: "pytest (tests/test_e2e_phase1.py; requires TEST_RUT + sample PDFs)"
  commands:
    unit:
      - scope: "."
        command: "POSTGRES_USER=finhealth POSTGRES_PASSWORD=secret POSTGRES_DB=finhealth pytest"
        framework: "pytest"
    integration:
      - scope: "."
        command: "POSTGRES_TEST_HOST=127.0.0.1 POSTGRES_TEST_PORT=5432 POSTGRES_TEST_USER=finhealth POSTGRES_TEST_PASSWORD=secret pytest"
        framework: "pytest (isolated PostgreSQL databases)"
    e2e:
      - scope: "."
        command: "TEST_RUT=<rut> pytest tests/test_e2e_phase1.py"
        framework: "pytest (real PDF ingestion)"
  coverage:
    command: "POSTGRES_USER=finhealth POSTGRES_PASSWORD=secret POSTGRES_DB=finhealth pytest"
    commands:
      - scope: "."
        command: "POSTGRES_USER=finhealth POSTGRES_PASSWORD=secret POSTGRES_DB=finhealth pytest --cov=app --cov-report=term-missing"
        framework: "pytest-cov (coverage is on by default via addopts)"

quality:
  lint: "ruff check app tests"
  lint_commands:
    - scope: "."
      command: "ruff check app tests"
      framework: "ruff"
  typecheck: "mypy --strict app/"
  typecheck_commands:
    - scope: "."
      command: "mypy --strict app/"
      framework: "mypy (strict, pydantic plugin)"
  format: "ruff format app tests"
  format_commands:
    - scope: "."
      command: "ruff format app tests"
      framework: "ruff format"
  focused_harness:
    - scope: "."
      command: "./scripts/verify.sh"
      framework: "focused application + PostgreSQL/Compose lifecycle + docs checks"
